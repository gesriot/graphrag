[package]
name = "cjson_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pure std: structure-preserving port of cJSON's node tree (Box child/next).
# Float printing uses libc snprintf/sscanf (not a crate dep); under Miri that
# path is cfg'd out so ownership tests can run without foreign code.

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.5"
