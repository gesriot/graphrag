[project]
name = "graphrag-code"
version = "0.1.0"
description = "Deterministic code-graph rails for bounded Python/C to Rust ports: index, query, context packs, and a read-only persisted-integrity doctor."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.3",
    "graphrag>=3.1.0",
    # Generated strict argument models use the 2.0 SDK surface; upgrade deliberately.
    "mcp==2.0.0",
    "mcp-types==2.0.0",
    "networkx>=3.6.1",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "python-dotenv>=1.2.2",
    "tree-sitter>=0.25.2",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-python>=0.25.0",
    "typer>=0.26.7",
]

[project.scripts]
graphrag-code = "graphrag_code.cli:main"

[dependency-groups]
dev = [
    "hatchling>=1.27.0",
    "pytest>=9.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_code"]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/graphrag_code",
    "scripts",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
]
